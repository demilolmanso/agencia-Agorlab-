<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useCallback, useMemo } = React;

// ============ ICONOS (lucide) ============
const Icon = ({ name, size = 20, strokeWidth = 1.8, className = "" }) => {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = "";
      const svg = window.lucide.createElement(window.lucide.icons[name] || window.lucide.icons.Circle);
      svg.setAttribute("width", size);
      svg.setAttribute("height", size);
      svg.setAttribute("stroke-width", strokeWidth);
      svg.setAttribute("class", className);
      ref.current.appendChild(svg);
    }
  }, [name, size, strokeWidth, className]);
  return <span ref={ref} style={{ display: "inline-flex" }} />;
};

// ============ DOCK (estilo macOS con magnificación real) ============
const Dock = ({
  items,
  baseItemSize = 50,
  magnification = 70,
  panelHeight = 68,
  accentColor = "#0a84ff",
  position = "bottom",
  distance = 200,
  gap = 10,
  showLabels = true,
  showIndicators = true,
  showBadges = true,
  bounce = true,
  onItemClick,
  activeIds = [],
}) => {
  const dockRef = useRef(null);
  const [mouseX, setMouseX] = useState(null);
  const [openMenu, setOpenMenu] = useState(null);
  const [bouncingId, setBouncingId] = useState(null);

  const handleMouseMove = (e) => {
    if (!dockRef.current) return;
    const rect = dockRef.current.getBoundingClientRect();
    setMouseX(e.clientX - rect.left);
  };

  const handleClick = (item) => {
    if (item.separator) return;
    if (item.menu) {
      setOpenMenu(openMenu === item.label ? null : item.label);
      return;
    }
    if (bounce) {
      setBouncingId(item.label);
      setTimeout(() => setBouncingId(null), 600);
    }
    onItemClick && onItemClick(item);
  };

  const getScale = (index) => {
    if (mouseX === null || !dockRef.current) return 1;
    const itemsEls = dockRef.current.querySelectorAll("[data-dock-item]");
    const el = itemsEls[index];
    if (!el) return 1;
    const rect = el.getBoundingClientRect();
    const dockRect = dockRef.current.getBoundingClientRect();
    const itemCenter = rect.left - dockRect.left + rect.width / 2;
    const dist = Math.abs(mouseX - itemCenter);
    if (dist > distance) return 1;
    const factor = 1 - dist / distance;
    const scale = 1 + (magnification / baseItemSize - 1) * Math.pow(factor, 2);
    return scale;
  };

  return (
    <div className="fixed bottom-4 left-0 right-0 flex justify-center z-50 pointer-events-none">
      <div
        ref={dockRef}
        onMouseMove={handleMouseMove}
        onMouseLeave={() => { setMouseX(null); setOpenMenu(null); }}
        className="dock-glass rounded-2xl px-3 flex items-end pointer-events-auto"
        style={{ height: panelHeight, gap: `${gap}px`, paddingBottom: 6 }}
      >
        {items.map((item, i) => {
          if (item.separator) {
            return <div key={i} className="w-px h-10 bg-white/20 self-center mx-1" />;
          }
          const scale = getScale(i);
          const size = baseItemSize * scale;
          const isActive = activeIds.includes(item.label);
          const isBouncing = bouncingId === item.label;

          return (
            <div
              key={item.label}
              data-dock-item
              className="dock-item relative flex items-center justify-center cursor-pointer"
              style={{
                width: size,
                height: size,
                borderRadius: size * 0.22,
                transform: `scale(1)`,
              }}
              onClick={() => handleClick(item)}
            >
              <div
                className={`w-full h-full flex items-center justify-center rounded-[22%] ${isBouncing ? "bounce" : ""}`}
                style={{
                  background: item.gradient || "linear-gradient(135deg, #374151, #1f2937)",
                  boxShadow: "0 4px 12px rgba(0,0,0,0.3), inset 0 1px 0 rgba(255,255,255,0.15)",
                  color: item.color || "#fff",
                  ["--scale-tf"]: `scale(${scale})`,
                }}
              >
                {item.icon}
              </div>

              {showBadges && item.badge && (
                <div className="badge">{item.badge}</div>
              )}

              {showLabels && (
                <div className="dock-label">{item.label}</div>
              )}

              {showIndicators && isActive && (
                <div className="indicator" />
              )}

              {openMenu === item.label && item.menu && (
                <div className="menu glass">
                  {item.menu.map((m, idx) => {
                    if (m.separator) return <div key={idx} className="menu-sep" />;
                    return (
                      <div
                        key={idx}
                        className="menu-item"
                        onClick={(e) => {
                          e.stopPropagation();
                          m.onClick && m.onClick();
                          setOpenMenu(null);
                        }}
                      >
                        <span>{m.label}</span>
                        {m.checked && <span style={{ color: accentColor }}>✓</span>}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ============ VENTANAS ============
const Window = ({ title, children, onClose, width = 720, height = 480, top = 80, left = 120 }) => {
  const [pos, setPos] = useState({ x: left, y: top });
  const [dragging, setDragging] = useState(false);
  const offset = useRef({ x: 0, y: 0 });

  const onMouseDown = (e) => {
    setDragging(true);
    offset.current = { x: e.clientX - pos.x, y: e.clientY - pos.y };
  };
  useEffect(() => {
    if (!dragging) return;
    const move = (e) => setPos({ x: e.clientX - offset.current.x, y: e.clientY - offset.current.y });
    const up = () => setDragging(false);
    window.addEventListener("mousemove", move);
    window.addEventListener("mouseup", up);
    return () => {
      window.removeEventListener("mousemove", move);
      window.removeEventListener("mouseup", up);
    };
  }, [dragging]);

  return (
    <div
      className="glass rounded-xl overflow-hidden window-enter absolute flex flex-col"
      style={{ width, height, left: pos.x, top: pos.y }}
    >
      <div
        onMouseDown={onMouseDown}
        className="flex items-center gap-2 px-4 py-2.5 border-b border-white/10 cursor-grab select-none"
        style={{ background: "rgba(40,40,50,0.6)" }}
      >
        <div className="traffic-light flex gap-2">
          <span className="tl-red" onClick={onClose} style={{ cursor: "pointer" }} />
          <span className="tl-yellow" />
          <span className="tl-green" />
        </div>
        <div className="flex-1 text-center text-sm font-medium text-white/80">{title}</div>
        <div style={{ width: 54 }} />
      </div>
      <div className="flex-1 overflow-auto scrollbar">{children}</div>
    </div>
  );
};

    {
      label: "Configuración",
      icon: <Icon name="Settings" size={24} strokeWidth={1.8} />,
      gradient: "linear-gradient(135deg, #6b7280, #374151)",
    },
    {
      label: "Ahorro",
      icon: <Icon name="Trash2" size={24} strokeWidth={1.8} />,
      gradient: "linear-gradient(135deg, #ef4444, #991b1b)",
    },
  ];

  const handleItemClick = (item) => {
    if (item.separator) return;
    setOpenWindows((o) => ({ ...o, [item.label]: true }));
    bringToFront(item.label);
  };

  const windowConfig = {
    Home: { title: "🏠 Inicio · Tu tienda sin comisiones", content: <HomeContent />, w: 780, h: 540, x: 80, y: 60 },
    Pedidos: { title: "🛍️ Pedidos · MailContent", content: <MailContent />, w: 620, h: 480, x: 160, y: 100 },
    Mensajes: { title: "💬 Mensajes de clientes", content: <MailContent />, w: 620, h: 480, x: 200, y: 120 },
    Productos: {
      title: "👕 Catálogo de productos",
      content: (
        <div className="p-6">
          <div className="flex items-center justify-between mb-4">
            <h2 className="text-xl font-bold">Tu catálogo</h2>
            <button className="bg-blue-500 hover:bg-blue-600 px-3 py-1.5 rounded-lg text-sm">+ Agregar producto</button>
          </div>
          <div className="grid grid-cols-3 gap-4">
            {[
              { name: "Remera Oversize", price: "$18.500", color: "from-pink-500 to-rose-600", stock: 24 },
              { name: "Jean Mom", price: "$35.900", color: "from-blue-500 to-indigo-600", stock: 12 },
              { name: "Campera de Jean", price: "$52.000", color: "from-slate-500 to-slate-700", stock: 8 },
              { name: "Vestido Floral", price: "$28.500", color: "from-purple-500 to-fuchsia-600", stock: 15 },
              { name: "Buzo Canguro", price: "$24.900", color: "from-emerald-500 to-teal-600", stock: 30 },
              { name: "Short Deportivo", price: "$12.500", color: "from-amber-500 to-orange-600", stock: 42 },
            ].map((p, i) => (
              <div key={i} className="product-card bg-white/5 rounded-xl overflow-hidden border border-white/10">
                <div className={`h-32 bg-gradient-to-br ${p.color} flex items-center justify-center`}>
                  <Icon name="Shirt" size={48} strokeWidth={1.5} className="text-white/80" />
                </div>
                <div className="p-3">
                  <div className="font-semibold text-sm">{p.name}</div>
                  <div className="flex items-center justify-between mt-1">
                    <span className="text-blue-400 font-bold">{p.price}</span>
                    <span className="text-xs text-white/50">Stock: {p.stock}</span>
                  </div>
                </div>
              </div>
            ))}
          </div>
        </div>
      ),
      w: 720, h: 520, x: 140, y: 80,
    },
    Música: { title: "🎵 Ambiente de tienda", content: <MusicContent />, w: 480, h: 560, x: 240, y: 60 },
    Configuración: { title: "⚙️ Configuración", content: <SettingsContent />, w: 560, h: 560, x: 180, y: 70 },
    Ahorro: { title: "💸 Tu ahorro vs Tiendanube", content: <TrashContent />, w: 640, h: 520, x: 200, y: 90 },
  };

  return (
    <div className="w-full h-full relative">
      {/* Barra superior estilo macOS */}
      <div className="fixed top-0 left-0 right-0 h-7 bg-black/40 backdrop-blur-xl flex items-center px-4 text-xs z-40 border-b border-white/5">
        <span className="font-bold mr-4"></span>
        <span className="mr-4 font-semibold">Demo Tienda</span>
        <span className="text-white/60 mr-4">Archivo</span>
        <span className="text-white/60 mr-4">Editar</span>
        <span className="text-white/60 mr-4">Ver</span>
        <span className="text-white/60 mr-4">Ventana</span>
        <span className="text-white/60 mr-4">Ayuda</span>
        <div className="ml-auto flex items-center gap-3 text-white/80">
          <Icon name="Wifi" size={13} />
          <Icon name="Battery" size={13} />
          <span>Mié 4 Nov · 14:32</span>
        </div>
      </div>

      {/* Texto central de bienvenida */}
      <div className="absolute top-20 left-1/2 -translate-x-1/2 text-center pointer-events-none z-0">
        <h1 className="text-6xl font-bold mb-2" style={{ textShadow: "0 4px 30px rgba(0,0,0,0.5)" }}>
          Tu tienda online
        </h1>
        <p className="text-2xl text-white/70">Hacé click en los iconos del Dock 👇</p>
      </div>

      {/* Ventanas abiertas */}
      {Object.keys(openWindows).map((id) => {
        const cfg = windowConfig[id];
        if (!cfg) return null;
        return (
          <div key={id} style={{ zIndex: zIndex[id] || 10 }} onClick={() => bringToFront(id)}>
            <Window
              title={cfg.title}
              onClose={() => closeWindow(id)}
              width={cfg.w}
              height={cfg.h}
              top={cfg.y}
              left={cfg.x}
            >
              {cfg.content}
            </Window>
          </div>
        );
      })}

      {/* DOCK */}
      <Dock
        items={items}
        baseItemSize={52}
        magnification={78}
        panelHeight={72}
        accentColor="#0a84ff"
        position="bottom"
        distance={180}
        gap={10}
        showLabels
        showIndicators
        showBadges
        bounce
        onItemClick={handleItemClick}
        activeIds={Object.keys(openWindows)}
      />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
