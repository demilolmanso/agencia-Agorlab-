<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>AgorShopping</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'><rect width='512' height='512' rx='206' fill='%233B82F6'/><g transform='translate(133 133) scale(10.25)' fill='none' stroke='%23f0f0f0' stroke-linecap='round' stroke-linejoin='round' stroke-width='2'><path d='M2.048 18.566A2 2 0 0 0 4 21h16a2 2 0 0 0 1.952-2.434l-2-9A2 2 0 0 0 18 8H6a2 2 0 0 0-1.952 1.566z'/><path d='M8 11V6a4 4 0 0 1 8 0v5'/></g></svg>"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<meta name="theme-color" content="#f5f4f1"/>
<script>
/* Tema guardado en caché (localStorage): se aplica antes de pintar para evitar parpadeos */
(function(){var t='light';try{var v=localStorage.getItem('agor-theme');if(v==='dark'||v==='light')t=v;}catch(e){}
document.documentElement.setAttribute('data-theme',t);
var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='dark'?'#0b0b0e':'#f5f4f1');})();
</script>
<script>
/* Marca: el color viene de Firebase (config/store.vorticeColor). Se cachea para no parpadear al cargar. */
(function(){
  var DEF='#3B82F6';
  function cached(){try{return localStorage.getItem('agor-brand');}catch(e){return null;}}
  function norm(h){h=String(h||'').trim().replace('#','');if(h.length===3)h=h.split('').map(function(c){return c+c;}).join('');return /^[0-9a-f]{6}$/i.test(h)?'#'+h.toLowerCase():DEF.toLowerCase();}
  function rgb(h){h=norm(h).slice(1);return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
  function hsl(h){var c=rgb(h),r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,l=(mx+mn)/2,hh=0,s=0;
    if(d){s=d/(1-Math.abs(2*l-1));hh=mx===r?((g-b)/d)%6:(mx===g?(b-r)/d+2:(r-g)/d+4);hh=Math.round(hh*60);if(hh<0)hh+=360;}
    return [hh,Math.round(s*100),Math.round(l*100)];}
  function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
  function on(h){var c=rgb(h);return (0.299*c[0]+0.587*c[1]+0.114*c[2])/255>0.62?'#111114':'#ffffff';}
  function favicon(h){
    var svg="<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'><rect width='512' height='512' rx='206' fill='"+h+"'/>"+
      "<g transform='translate(133 133) scale(10.25)' fill='none' stroke='"+on(h)+"' stroke-linecap='round' stroke-linejoin='round' stroke-width='2'>"+
      "<path d='M2.048 18.566A2 2 0 0 0 4 21h16a2 2 0 0 0 1.952-2.434l-2-9A2 2 0 0 0 18 8H6a2 2 0 0 0-1.952 1.566z'/><path d='M8 11V6a4 4 0 0 1 8 0v5'/></g></svg>";
    return 'data:image/svg+xml,'+encodeURIComponent(svg);}
  function apply(hex,theme){
    hex=norm(hex||cached()||DEF);
    var oscuro=(theme||document.documentElement.getAttribute('data-theme'))==='dark';
    var c=rgb(hex),q=hsl(hex),H=q[0],S=q[1],L=q[2],lp=oscuro?Math.max(L,62):Math.min(L,46);
    function hs(l){return 'hsl('+H+','+S+'%,'+l+'%)';}
    var st=document.documentElement.style;
    st.setProperty('--brand',hex);
    st.setProperty('--brand-rgb',c.join(','));
    st.setProperty('--brand-deep',hs(clamp(Math.round(L*0.38),10,22)));
    st.setProperty('--brand-mid',hs(clamp(L,26,38)));
    st.setProperty('--on-brand',on(hex));
    st.setProperty('--primary',hs(lp));st.setProperty('--accent',hs(lp));st.setProperty('--primary-dark',hs(Math.max(lp-10,12)));
    var f=document.getElementById('favicon');if(f)f.setAttribute('href',favicon(hex));
    try{localStorage.setItem('agor-brand',hex);}catch(e){}
  }
  window.AgorBrand={apply:apply,on:on,norm:norm};
  apply();
})();
</script>
<style>
:root{
  color-scheme:light;
  --primary:#2563eb;--primary-dark:#1d4ed8;--accent:#2563eb;
  --bg:#f5f4f1;--bg-card:#ffffff;--bg-elev:#efeee9;--soft:#f4f3ef;
  --border:#e5e3dd;--text:#16161b;--muted:#6b6b77;
  --ink:#111114;--on-ink:#ffffff;--glass:rgba(255,255,255,.92);
  --shadow:0 1px 2px rgba(16,16,24,.05),0 10px 28px -14px rgba(16,16,24,.2);
  --brand:#3B82F6;--brand-rgb:59,130,246;--brand-deep:hsl(217,91%,22%);--brand-mid:hsl(217,91%,38%);--on-brand:#ffffff;
  --ring:rgba(var(--brand-rgb),.2);--tint:rgba(var(--brand-rgb),.09);
  --ok:#15803d;--okbg:rgba(21,128,61,.1);
  --warn:#b45309;--warnbg:rgba(180,83,9,.1);
  --err:#dc2626;--errbg:rgba(220,38,38,.09);
  --used:#475569;--usedbg:rgba(71,85,105,.1);
  --r:16px;--r-sm:12px;
  --display:'Space Grotesk','Inter',-apple-system,sans-serif;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --primary:#60a5fa;--primary-dark:#3b82f6;--accent:#60a5fa;
  --bg:#0b0b0e;--bg-card:#16161b;--bg-elev:#1f1f26;--soft:#1b1b22;
  --border:#2a2a33;--text:#f1f1f4;--muted:#9b9ba8;
  --ink:#f4f4f6;--on-ink:#111114;--glass:rgba(20,20,26,.9);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.7);
  --ring:rgba(var(--brand-rgb),.3);--tint:rgba(var(--brand-rgb),.14);
  --ok:#4ade80;--okbg:rgba(74,222,128,.12);
  --warn:#fbbf24;--warnbg:rgba(251,191,36,.12);
  --err:#f87171;--errbg:rgba(248,113,113,.12);
  --used:#94a3b8;--usedbg:rgba(148,163,184,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .25s,color .25s;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit}
a{color:inherit}
img{display:block}

.splash,.splash-boot{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px}
.splash p,.splash-boot p{font-size:12px;letter-spacing:2.5px;font-weight:600;color:var(--muted);text-transform:uppercase}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:var(--bg)}
.login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:24px;padding:34px 26px;width:100%;max-width:380px;text-align:center;box-shadow:var(--shadow)}
.login-logo{width:74px;height:74px;object-fit:contain;margin:0 auto 12px;border-radius:16px}
.login-emoji{margin-bottom:10px;display:flex;align-items:center;justify-content:center}
.login-card h1{font-size:26px;font-weight:700;font-family:var(--display);letter-spacing:-.02em;color:var(--text)}
.tagline{color:var(--muted);font-size:13px;margin-top:6px}
.login-text{font-size:13.5px;color:var(--muted);margin:16px 0 22px;line-height:1.6}
.login-note{font-size:12px;color:var(--muted);margin-top:16px}

.header{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:11px 16px;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:34px;height:34px;border-radius:9px;object-fit:contain}
.brand-name{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-.03em;white-space:nowrap;color:var(--text)}
.brand-name span{font-weight:400;color:var(--muted)}
.chip-admin{font-size:10px;font-weight:700;background:var(--brand);color:var(--on-brand);padding:3px 8px;border-radius:999px;letter-spacing:.8px}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid var(--border);background:var(--bg-card);color:var(--text);display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{border-color:var(--primary);color:var(--primary)}
.user-menu{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--on-ink);box-shadow:0 0 0 2px var(--bg-card),0 0 0 4px var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;user-select:none}
.dropdown{position:absolute;right:0;top:48px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;width:250px;z-index:60;animation:pop .15s ease}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}}
.dd-name{font-weight:700;font-size:14px;color:var(--text)}
.dd-mail{font-size:12px;color:var(--muted);margin:2px 0 10px;word-break:break-all}
.dd-addr{font-size:11.5px;color:var(--muted);margin-bottom:10px;line-height:1.45;white-space:pre-line;padding:10px;background:var(--soft);border-radius:var(--r-sm)}
.dd-addr b{color:var(--text);font-size:11.5px}
.dd-addr-empty{font-size:11.5px;color:var(--warn);margin-bottom:10px;padding:10px;background:var(--warnbg);border-radius:var(--r-sm)}
.dd-btn{width:100%;padding:10px;font-weight:600;font-size:13px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:6px;background:var(--bg-card);color:var(--text)}
.dd-btn:hover{border-color:var(--primary);color:var(--primary)}
.dd-logout{width:100%;padding:10px;border-radius:var(--r-sm);background:var(--errbg);color:var(--err);font-weight:600;font-size:13px;margin-top:4px}

.header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:linear-gradient(90deg,transparent,var(--brand),transparent);opacity:.75}
.section-title::before,.list-title::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--brand);margin-right:8px;vertical-align:middle}
.brand-prev{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.brand-prev .sw{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center}
.brand-prev .pill{padding:9px 16px;border-radius:12px;font-weight:600;font-size:13px}
.app{max-width:560px;margin:0 auto;padding:16px 16px 110px;position:relative;z-index:1}
.banner{background:var(--tint);border:1px solid var(--ring);color:var(--text);border-radius:var(--r-sm);padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:14px;backdrop-filter:blur(10px)}
.hero{
  position:relative;overflow:hidden;
  background:radial-gradient(120% 140% at 100% 0%,rgba(var(--brand-rgb),.5) 0%,transparent 58%),linear-gradient(135deg,var(--brand-deep) 0%,var(--brand-mid) 140%);
  border-radius:22px;padding:28px 22px;color:#fff;margin-bottom:20px;box-shadow:var(--shadow);
}
.hero h2{font-size:30px;font-weight:700;margin-bottom:8px;font-family:var(--display);letter-spacing:-.03em;line-height:1.1}
.hero p{font-size:14px;color:rgba(255,255,255,.78);line-height:1.55;max-width:420px}
.section-title{
  display:inline-block;font-size:14px;font-weight:600;margin:4px 0 14px;padding:7px 16px;
  font-family:var(--display);letter-spacing:-.01em;color:var(--text);
  background:var(--glass);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(10px);
}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:44px 20px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);line-height:1.8}

.filter-row{display:flex;gap:10px;margin-bottom:16px;padding:10px;background:var(--glass);border:1px solid var(--border);border-radius:var(--r);backdrop-filter:blur(10px)}
.filter-row > div{flex:1;min-width:0}
select.input{
  height:46px;appearance:none;-webkit-appearance:none;-moz-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 19px) 50%,calc(100% - 13px) 50%;
  background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;cursor:pointer;
}
select.input option{background:var(--bg-card);color:var(--text)}
select.input:disabled{opacity:.5;cursor:not-allowed}
.filter-clear{font-size:12px;font-weight:600;background:var(--bg-elev);color:var(--muted);padding:12px 14px;border-radius:var(--r-sm)}
.filter-clear:hover{color:var(--text)}

.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:379px){.prod-grid{grid-template-columns:1fr}}
.prod-card{background:var(--bg-card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow);cursor:pointer;transition:transform .2s,box-shadow .2s}
.prod-card:hover{transform:translateY(-3px);box-shadow:0 16px 32px -16px rgba(var(--brand-rgb),.55)}
.prod-card:active{transform:scale(.98)}
.prod-img-wrap{position:relative;aspect-ratio:4/5;background:var(--soft);overflow:hidden}
.prod-img{width:100%;height:100%;object-fit:cover;transition:transform .4s}
.prod-card:hover .prod-img{transform:scale(1.05)}
.prod-img.ph{display:flex;align-items:center;justify-content:center;background:var(--soft)}
.ph svg{opacity:.3;filter:grayscale(1)}
.nostock{position:absolute;top:10px;left:10px;background:var(--ink);color:var(--on-ink);font-size:10px;font-weight:600;padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.prod-body{padding:12px 13px 14px}
.prod-name{font-weight:600;font-size:14px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--text)}
.chip{display:inline-block;margin-top:6px;font-size:10.5px;font-weight:600;color:var(--muted);background:var(--soft);padding:3px 9px;border-radius:999px}
.chip + .chip{margin-left:4px}
.prod-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.price{font-weight:700;font-size:15px;color:var(--text);font-family:var(--display);letter-spacing:-.01em}
.stock-lbl{font-size:11px;color:var(--muted);font-weight:500}

.btn{display:block;width:100%;padding:14px;border-radius:var(--r-sm);font-weight:600;font-size:15px;text-align:center;transition:all .15s;text-decoration:none}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;pointer-events:none}
.btn-primary{background:var(--brand);color:var(--on-brand);box-shadow:0 10px 22px -12px rgba(var(--brand-rgb),.8)}
.btn-primary:hover{opacity:.88}
.btn-ghost{background:var(--bg-elev);color:var(--text);margin-top:9px}
.btn-ghost:hover{background:var(--border)}
.btn-mini{margin-top:9px;font-size:12px;font-weight:600;background:var(--ink);color:var(--on-ink);padding:8px 14px;border-radius:999px}

.overlay{position:fixed;inset:0;background:rgba(10,10,14,.55);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:100;animation:fade .18s ease}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg-card);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;animation:up .22s cubic-bezier(.2,.8,.3,1);box-shadow:var(--shadow)}
@keyframes up{from{transform:translateY(40px);opacity:.6}}
@media(min-width:600px){.overlay{align-items:center;padding:20px}.sheet{border-radius:24px;border:1px solid var(--border)}}
.sheet-handle{width:42px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 16px}
.sheet-title{font-size:19px;font-weight:700;margin-bottom:14px;color:var(--text);font-family:var(--display);letter-spacing:-.02em}
label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.input{width:100%;padding:13px 14px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:15px;background:var(--bg-card);color:var(--text);transition:border-color .15s,box-shadow .15s}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px var(--ring)}
textarea.input{resize:vertical}
.input.mini{width:86px;text-align:center}

.profile-tabs{display:flex;gap:4px;margin-bottom:16px;padding:4px;background:var(--soft);border-radius:var(--r-sm)}
.profile-tab{flex:1;padding:10px;font-size:13px;font-weight:600;color:var(--muted);border-radius:9px;transition:all .15s}
.profile-tab.active{color:var(--text);background:var(--bg-card);box-shadow:var(--shadow)}

.buy-resumen{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-radius:var(--r-sm);padding:13px 14px;margin-bottom:6px}
.buy-resumen b{font-size:14px;color:var(--text)}
.buy-addr-preview{font-size:12px;color:var(--muted);line-height:1.5;margin:8px 0 4px;padding:11px 13px;background:var(--soft);border-radius:var(--r-sm);white-space:pre-line}
.buy-addr-preview b{color:var(--text);font-size:12px}
.buy-addr-edit{font-size:12px;color:var(--primary);cursor:pointer;margin-top:6px;font-weight:600;text-decoration:underline}

.det-carousel{position:relative;width:100%;background:var(--soft);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.det-carousel-track{display:flex;transition:transform .35s cubic-bezier(.2,.8,.3,1);touch-action:pan-y}
.det-carousel-slide{flex:0 0 100%;aspect-ratio:4/5;display:flex;align-items:center;justify-content:center;cursor:zoom-in}
.det-carousel-slide img{width:100%;height:100%;object-fit:cover;user-select:none;-webkit-user-drag:none}
.det-carousel-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:64px;background:var(--soft)}
.det-nav{position:absolute;top:50%;transform:translateY(-50%);width:38px;height:38px;background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;border-radius:50%;cursor:pointer;transition:all .15s;box-shadow:var(--shadow)}
.det-nav:hover{background:var(--ink);color:var(--on-ink)}
.det-nav.prev{left:10px}
.det-nav.next{right:10px}
.det-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:5px 8px;background:var(--glass);border-radius:99px}
.det-dot{width:7px;height:7px;border-radius:50%;background:var(--border);border:none;cursor:pointer;padding:0;transition:all .2s}
.det-dot.active{background:var(--brand);transform:scale(1.25)}

.zoom-overlay{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;animation:fade .15s ease}
.zoom-overlay img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}

.det-img{width:100%;border-radius:var(--r);margin-bottom:14px;max-height:230px;object-fit:cover}
.det-img.ph{height:150px;display:flex;align-items:center;justify-content:center;background:var(--soft)}
.det-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:6px}
.det-head h3{font-size:19px;font-weight:700;color:var(--text);font-family:var(--display);letter-spacing:-.02em}
.det-price{white-space:nowrap;font-size:19px}
.det-desc{font-size:13.5px;color:var(--muted);line-height:1.6;margin:12px 0;white-space:pre-wrap}
.det-stock{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:14px}

.pedido-card{display:flex;align-items:center;gap:12px;background:var(--bg-card);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s}
.pedido-card:hover{transform:translateY(-2px)}
.pedido-main{flex:1;min-width:0}
.pedido-nom{font-weight:600;font-size:14.5px;color:var(--text)}
.pedido-meta{font-size:12px;color:var(--muted);margin:3px 0 8px}
.pedido-addr{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:8px;padding:8px 10px;background:var(--soft);border-radius:10px;white-space:pre-line}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:4px 11px;border-radius:999px}
.badge-pend{background:var(--warnbg);color:var(--warn)}
.badge-rech{background:var(--errbg);color:var(--err)}

async function nextNumero() {
  try {
    let n = 0;
    await db.runTransaction(async t => {
      const ref = db.collection('counters').doc('pedidos');
      const snap = await t.get(ref);
      n = (snap.exists ? (snap.data().seq || 0) : 0) + 1;
      t.set(ref, { seq: n }, { merge: true });
    });
    return n;
  } catch (e) {
    return Math.floor(Date.now() / 1000) % 1000000;
  }
}

async function descontarStock(productoId) {
  if (!productoId) return;
  try {
    await db.runTransaction(async t => {
      const pr = db.collection('productos').doc(productoId);
      const ps = await t.get(pr);
      if (ps.exists) t.update(pr, { stock: Math.max(0, (ps.data().stock || 1) - 1) });
    });
  } catch (e) {}
}

  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.message || ('Mercado Pago respondió ' + r.status));

}

  try { return await mpPost('/checkout/preferences', payload); }

/* ══════════ GUARDAR / CARGAR PERFIL DE USUARIO ══════════ */
async function saveProfile(uid, profile) {
  const clean = Object.assign({}, EMPTY_PROFILE);
  for (const k of Object.keys(EMPTY_PROFILE)) {
    if (profile && profile[k] != null) clean[k] = String(profile[k]).trim();
  }
  clean.actualizadoEl = Date.now();
  await db.collection('users').doc(uid).set(clean, { merge: true });
  return clean;
}
async function loadProfile(uid) {
  try {
    const snap = await db.collection('users').doc(uid).get();
    if (!snap.exists) return Object.assign({}, EMPTY_PROFILE);
    return Object.assign({}, EMPTY_PROFILE, snap.data());
  } catch (e) {
    return Object.assign({}, EMPTY_PROFILE);
  }
}

const FONDOS_OK = ['vortice', 'liso', 'imagen'];
const COLOR_VORTICE_DEFAULT = '#3B82F6';

function hexToHsl(hex) {
  let h = String(hex || '').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(h)) h = '2563eb';
  const r = parseInt(h.slice(0, 2), 16) / 255, g = parseInt(h.slice(2, 4), 16) / 255, b = parseInt(h.slice(4, 6), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min, l = (max + min) / 2;
  let hh = 0, sat = 0;
  if (d) {
    sat = d / (1 - Math.abs(2 * l - 1));
    hh = max === r ? ((g - b) / d) % 6 : (max === g ? (b - r) / d + 2 : (r - g) / d + 4);
    hh = Math.round(hh * 60); if (hh < 0) hh += 360;
  }
  return [hh, Math.round(sat * 100), Math.round(l * 100)];
}

function VorticeBackground({ color, theme }) {
  const canvasRef = useRef(null);
  const rafRef = useRef(null);
  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const oscuro = theme === 'dark';
    let width = 0, height = 0;
    const resize = () => {
      width = window.innerWidth; height = window.innerHeight;
      canvas.width = width; canvas.height = height;
    };
    resize(); window.addEventListener('resize', resize);
    const CANTIDAD = 500;
    const hsl = hexToHsl(color || COLOR_VORTICE_DEFAULT);
    /* Oscuro: partículas claras y brillantes. Claro: partículas más intensas para que se vean sobre el fondo claro. */
    const deltas = oscuro ? [22, 10, 0, -10, -20, 30] : [-4, -14, -24, 0, -34, 8];
    const cl = v => oscuro ? Math.max(14, Math.min(88, v)) : Math.max(16, Math.min(72, v));
    const TONOS = deltas.map(d => 'hsl(' + hsl[0] + ',' + hsl[1] + '%,' + cl(hsl[2] + d) + '%)');
    const particulas = [];
    const resetParticula = (p) => {
      const maxDim = Math.max(width, height);
      p.radio = Math.random() * (maxDim * 0.65) + 15;
      p.angulo = Math.random() * Math.PI * 2;
      p.velocidadBase = Math.random() * 0.004 + 0.002;
      p.velocidadSuccion = Math.random() * 0.5 + 0.2;
      p.tamano = Math.random() * 1.8 + 0.6;
      p.color = TONOS[Math.floor(Math.random() * TONOS.length)];
    };
    for (let i = 0; i < CANTIDAD; i++) { const p = {}; resetParticula(p); particulas.push(p); }
    const COLA = 9; /* largo de la estela, en cuadros */
    const animar = () => {
      rafRef.current = requestAnimationFrame(animar);
      ctx.clearRect(0, 0, width, height); /* el color de fondo lo pone el CSS (tema) */
      ctx.lineCap = 'round';
      ctx.globalAlpha = oscuro ? 1 : 0.85;
      const cx = width / 2, cy = height / 2;
      for (let i = 0; i < particulas.length; i++) {
        const p = particulas[i];
        const paso = p.velocidadBase * (1 + (300 / (p.radio + 15)));
        p.angulo -= paso;
        p.radio -= p.velocidadSuccion;
        if (p.radio <= 2) { resetParticula(p); continue; }
        const x = cx + Math.cos(p.angulo) * p.radio;
        const y = cy + Math.sin(p.angulo) * p.radio;
        const a2 = p.angulo + paso * COLA, r2 = p.radio + p.velocidadSuccion * COLA;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a2) * r2, cy + Math.sin(a2) * r2);
        ctx.lineTo(x, y);
        ctx.strokeStyle = p.color; ctx.lineWidth = p.tamano;
        if (oscuro) { ctx.shadowBlur = 6; ctx.shadowColor = p.color; }
        ctx.stroke();
      }
      ctx.shadowBlur = 0;
    };
    animar();
    return () => { window.removeEventListener('resize', resize); if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [color, theme]);
  return <canvas ref={canvasRef} className="vortex-bg"/>;
}

function authErrorMsg(e) {
  switch (e && e.code) {
    case 'auth/invalid-email':        return 'El correo no es válido.';
    case 'auth/weak-password':        return 'La contraseña debe tener al menos 6 caracteres.';
    case 'auth/wrong-password':
    case 'auth/invalid-credential':   return 'Contraseña incorrecta.';
    case 'auth/too-many-requests':    return 'Demasiados intentos. Esperá un momento y probá de nuevo.';
    case 'auth/network-request-failed': return 'Error de red. Revisá tu conexión.';
    case 'auth/user-disabled':        return 'Esta cuenta fue deshabilitada.';
    case 'auth/popup-blocked':        return 'El navegador bloqueó la ventana de Google. Habilitá los pop-ups e intentá de nuevo.';
    case 'auth/unauthorized-domain':  return 'Este dominio no está autorizado en Firebase (Authentication → Settings → Dominios autorizados).';
    case 'auth/operation-not-allowed':return 'El método de ingreso no está habilitado en Firebase.';
    case 'auth/account-exists-with-different-credential': return 'Ya existe una cuenta con ese correo usando otro método de ingreso.';
    default: return (e && e.message) || 'Error de autenticación.';
  }
}

/* ══════════ AUTH FORM: registro con datos de perfil ══════════ */
/* mode: 'signup' (registro completo) | 'signin' (solo login) | 'both' (decide solo) */
function AuthForm({ toast, onDone, cta, mode = 'both', initialEmail = '' }) {
  const [step, setStep] = useState('credentials'); // credentials | profile
  const [email, setEmail] = useState(initialEmail);
  const [pass, setPass] = useState('');
  const [profile, setProfile] = useState(Object.assign({}, EMPTY_PROFILE));
  const [busy, setBusy] = useState(false);
  const [authUser, setAuthUser] = useState(null);
  const [showEmail, setShowEmail] = useState(!!initialEmail);

  const setP = (k, v) => setProfile(p => Object.assign({}, p, { [k]: v }));

  /* Paso 1: autenticar */
  const authenticate = async () => {
    const mail = email.trim().toLowerCase();
    if (!/^\S+@\S+\.\S+$/.test(mail)) return toast('Ingresá un correo electrónico válido.', 'error');
    if (pass.length < 6) return toast('La contraseña debe tener al menos 6 caracteres.', 'error');
    setBusy(true);
    try {
      let created = false;
      let u;
      try {
        const cred = await auth.createUserWithEmailAndPassword(mail, pass);
        u = cred.user; created = true;
      } catch (e1) {
        if (e1.code === 'auth/email-already-in-use') {
          const cred2 = await auth.signInWithEmailAndPassword(mail, pass);
          u = cred2.user;
        } else throw e1;
      }
      setAuthUser(u);
      if (created || mode === 'signup') {
        // Usuario nuevo (o forzado signup): pide perfil
        const prof = await loadProfile(u.uid);
        if (!perfilCompleto(prof)) {
          setProfile(prof);
          setStep('profile');
          setBusy(false);
          return;
        }
      }
      // Usuario existente con perfil completo → directo
      toast('✅ Sesión iniciada.', 'success');
      if (onDone) onDone(u);
    } catch (e) {
      toast('❌ ' + authErrorMsg(e), 'error');
    }
    setBusy(false);
  };

  /* Ingreso con Google (popup; si el navegador lo bloquea, redirección) */
  const googleLogin = async () => {
    setBusy(true);
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      let cred;
      try {
        cred = await auth.signInWithPopup(provider);
      } catch (e1) {
        if (e1.code === 'auth/popup-blocked' || e1.code === 'auth/operation-not-supported-in-this-environment') {
          await auth.signInWithRedirect(provider);
          return;
        }
        throw e1;
      }
      const u = cred.user;
      setAuthUser(u);
      const prof = await loadProfile(u.uid);
      if (!perfilCompleto(prof)) {
        // Primera vez: pedimos datos de envío (nombre prellenado con el de Google)
        if (!prof.nombre && u.displayName) prof.nombre = u.displayName;
        setProfile(prof);
        setStep('profile');
        setBusy(false);
        return;
      }
      toast('✅ Sesión iniciada.', 'success');
      if (onDone) onDone(u);
    } catch (e) {
      if (e.code !== 'auth/popup-closed-by-user' && e.code !== 'auth/cancelled-popup-request') {
        toast('❌ ' + authErrorMsg(e), 'error');
      }
    }
    setBusy(false);
  };

  /* Paso 2: guardar perfil */
  const saveProfileStep = async () => {
    if (!perfilCompleto(profile)) {
      return toast('Completá todos los campos obligatorios (nombre, DNI, teléfono y dirección).', 'error');
    }
    setBusy(true);
    try {
      await saveProfile(authUser.uid, profile);
      toast('✅ Cuenta lista. ¡Bienvenido!', 'success');
      if (onDone) onDone(authUser);
    } catch (e) {
      toast('Error al guardar perfil: ' + e.message, 'error');
    }
    setBusy(false);
  };

  if (step === 'profile') {
    return (
      <div>
        <p className="hint" style={{marginBottom:12}}>
          Completá tus datos una sola vez. Los usaremos para autocompletar tus próximas compras y saber dónde enviarte los pedidos.
        </p>
        {PROFILE_FIELDS.map(f => (
          <div key={f.k}>
            <label>{f.label}{f.req ? ' *' : ''}</label>
            <input className="input" value={profile[f.k] || ''}
                   onChange={e => setP(f.k, e.target.value)}
                   placeholder={f.ph}
                   inputMode={f.inputMode || 'text'}/>
          </div>
        ))}
        <h4 style={{fontSize:13, fontWeight:800, marginTop:16, marginBottom:6, color:'var(--accent)', letterSpacing:1}}>📍 Dirección de envío</h4>
        {ADDRESS_FIELDS.filter(f => !f.textarea).map(f => (
          <div key={f.k} style={{marginTop:8}}>
            <label>{f.label}{f.req ? ' *' : ''}</label>
            <input className="input" value={profile[f.k] || ''}
                   onChange={e => setP(f.k, e.target.value)}
                   placeholder={f.ph}
                   inputMode={f.inputMode || 'text'}/>
          </div>
        ))}
        <label>Notas de entrega (opcional)</label>
        <textarea className="input" rows="2" value={profile.notas || ''}
                  onChange={e => setP('notas', e.target.value)}
                  placeholder="Ej: Timbre 2, dejar en portería"/>
        <button className="btn btn-primary" style={{marginTop:'16px'}} onClick={saveProfileStep} disabled={busy}>
          {busy ? 'Guardando…' : '💾 Guardar y continuar'}
        </button>
      </div>
    );
  }

  return (
    <div>
      <button type="button" className="btn btn-google" onClick={googleLogin} disabled={busy}>
        <GoogleIcon/> {busy ? 'Procesando…' : 'Continuar con Google'}
      </button>
      <div className="auth-or"><span>o</span></div>
      {!showEmail ? (
        <button type="button" className="btn btn-ghost" style={{marginTop:0}} onClick={() => setShowEmail(true)}>
          ✉️ Usar correo electrónico
        </button>
      ) : (
        <>
          <label style={{marginTop:0}}>Correo electrónico</label>
          <input className="input" type="email" autoComplete="email" value={email}
                 onChange={e => setEmail(e.target.value)} placeholder="tu@correo.com"/>
          <label>Contraseña (mín. 6 caracteres)</label>
          <input className="input" type="password" autoComplete="current-password" value={pass}
                 onChange={e => setPass(e.target.value)} placeholder="••••••••"
                 onKeyDown={e => { if (e.key === 'Enter') authenticate(); }}/>
          <button className="btn btn-primary" style={{marginTop:'16px'}} onClick={authenticate} disabled={busy}>
            {busy ? 'Procesando…' : (cta || '🔐 Crear cuenta / Ingresar')}
          </button>
        </>
      )}
    </div>
  );
}

function DetalleModal({ p, config, onClose, onComprar }) {
  const imgs = productoImagenes(p);
  const [idx, setIdx] = useState(0);
  const [zoom, setZoom] = useState(null);
  const touchRef = useRef(null);
  const total = imgs.length;
  const prev = () => setIdx(i => (i - 1 + total) % total);
  const next = () => setIdx(i => (i + 1) % total);
  const onTS = e => { touchRef.current = e.touches[0].clientX; };
  const onTE = e => {
    if (touchRef.current == null) return;
    const dx = e.changedTouches[0].clientX - touchRef.current;
    if (Math.abs(dx) > 45) { dx < 0 ? next() : prev(); }
    touchRef.current = null;
  };
  const safeIdx = total > 0 ? Math.min(idx, total - 1) : 0;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-handle"/>
        {total > 0 ? (
          <div className="det-carousel">
            <div className="det-carousel-track"
                 style={{transform:'translateX(-' + (safeIdx * 100) + '%)'}}
                 onTouchStart={onTS} onTouchEnd={onTE}>
              {imgs.map((src, i) => (
                <div key={i} className="det-carousel-slide" onClick={() => setZoom(src)}>
                  <img src={src} alt={'Imagen ' + (i + 1)} draggable={false}/>
                </div>
              ))}
            </div>
            {total > 1 && (
              <>
                <button className="det-nav prev" onClick={prev}>‹</button>
                <button className="det-nav next" onClick={next}>›</button>
                <div className="det-dots">
                  {imgs.map((_, i) => (
                    <button key={i}
                            className={'det-dot ' + (i === safeIdx ? 'active' : '')}
                            onClick={() => setIdx(i)} aria-label={'Ir a imagen ' + (i+1)}/>
                  ))}
                </div>
              </>
            )}
          </div>
        ) : (
          <div className="det-img ph"><LogoMark size={84}/></div>
        )}
        <div className="det-head">
          <h3>{p.nombre}</h3>
          <span className="price det-price">{money(p.precio, config)}</span>
        </div>
        {(p.categoria || p.talle) && (
          <div>
            {p.categoria && <span className="chip">{p.categoria}</span>}
            {p.talle && <span className="chip">Talle {p.talle}</span>}
          </div>
        )}
        <p className="det-desc">{p.descripcion || 'Sin descripción disponible.'}</p>
        <div className="det-stock">{p.stock > 0 ? '✔ ' + p.stock + ' unidades disponibles' : '✖ Sin stock'}</div>
        <button className="btn btn-primary" onClick={onComprar} disabled={p.stock <= 0}>🛒 Comprar ahora</button>
        <button className="btn btn-ghost" onClick={onClose}>Cerrar</button>
      </div>
      {zoom && (
        <div className="zoom-overlay" onClick={() => setZoom(null)}>
          <img src={zoom} alt="Zoom" onClick={e => e.stopPropagation()}/>
        </div>
      )}
    </div>
  );
}

function TiendaView({ productos, config, onComprar, toast }) {
  const [sel, setSel] = useState(null);
  const [fCat, setFCat] = useState('');
  const [fTalle, setFTalle] = useState('');
  const cats = ordenUnique(productos.map(p => norm(p.categoria)));
  const porCat = fCat ? productos.filter(p => norm(p.categoria) === fCat) : productos;
  const talles = ordenUnique(porCat.map(p => norm(p.talle)));
  const filtrados = fTalle ? porCat.filter(p => norm(p.talle) === fTalle) : porCat;
  const hayFiltros = !!(fCat || fTalle);
  const mostrarFiltros = cats.length > 0 || talles.length > 0;
  return (
    <div>
      <div className="hero">
        <h2>{config.heroTitle || 'Bienvenido'}</h2>
        <p>{config.heroText || 'Descubrí nuestra colección exclusiva.'}</p>
      </div>
      <h3 className="section-title">Catálogo</h3>
      {mostrarFiltros && (
        <div className="filter-row">
          <div>
            <select className="input" value={fCat} aria-label="Filtrar por categoría"
                    onChange={e => { setFCat(e.target.value); setFTalle(''); }}>
              <option value="">Categoría: todas</option>
              {cats.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
          </div>
          <div>
            <select className="input" value={fTalle} aria-label="Filtrar por talle"
                    disabled={talles.length === 0}
                    onChange={e => setFTalle(e.target.value)}>
              <option value="">Talle: todos</option>
              {talles.map(t => <option key={t} value={t}>{t}</option>)}
            </select>
          </div>
          {hayFiltros && (
            <div style={{flex:'0 0 auto', display:'flex', alignItems:'center'}}>
              <button className="filter-clear" onClick={() => { setFCat(''); setFTalle(''); }}>✕ Limpiar</button>
            </div>
          )}
        </div>
      )}
      {filtrados.length === 0 ? (
        productos.length === 0 ? (
          <div className="empty">El catálogo está vacío aún.<br/>Volvé pronto 😉</div>
        ) : (
          <div className="empty">
            No hay productos con esos filtros.<br/>
            <button className="btn btn-ghost" style={{maxWidth:'240px', margin:'14px auto 0'}}
                    onClick={() => { setFCat(''); setFTalle(''); }}>✕ Limpiar filtros</button>
          </div>
        )
      ) : (
        <div className="prod-grid">
          {filtrados.map(p => {
            const primera = productoImagenes(p)[0];
            return (
              <div key={p.id} className="prod-card" onClick={() => setSel(p)}>
                <div className="prod-img-wrap">
                  {primera ? <img src={primera} className="prod-img" alt=""/> : <div className="prod-img ph"><LogoMark size={68}/></div>}
                  {p.stock <= 0 && <span className="nostock">Agotado</span>}
                </div>
                <div className="prod-body">
                  <div className="prod-name">{p.nombre}</div>
                  {(p.categoria || p.talle) && (
                    <div>
                      {p.categoria && <span className="chip">{p.categoria}</span>}
                      {p.talle && <span className="chip">Talle {p.talle}</span>}
                    </div>
                  )}
                  <div className="prod-foot">
                    <span className="price">{money(p.precio, config)}</span>
                    <span className="stock-lbl">{p.stock} disp.</span>
                  </div>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {sel && <DetalleModal p={sel} config={config} onClose={() => setSel(null)}
        onComprar={() => { if (sel.stock <= 0) return toast('Sin stock disponible.', 'error'); onComprar(sel); setSel(null); }}/>}
    </div>
  );
}

/* ══════════ COMPRA: autocompleta con el perfil ══════════ */
function CompraModal({ producto, config, user, profile, onClose, toast, onOpenProfile }) {
  const [nombre, setNombre]   = useState((profile && profile.nombre) || '');
  const [dni, setDni]         = useState((profile && profile.dni) || '');
  const [telefono, setTel]    = useState((profile && profile.telefono) || '');
  const [calle, setCalle]     = useState((profile && profile.calle) || '');
  const [numero, setNum]      = useState((profile && profile.numero) || '');
  const [pisoDepto, setPiso]  = useState((profile && profile.pisoDepto) || '');
  const [ciudad, setCiudad]   = useState((profile && profile.ciudad) || '');
  const [provincia, setProv]  = useState((profile && profile.provincia) || '');
  const [cp, setCp]           = useState((profile && profile.cp) || '');
  const [notas, setNotas]     = useState((profile && profile.notas) || '');
  const [busy, setBusy] = useState(false);

  const direccionActual = { calle, numero, pisoDepto, ciudad, provincia, cp, notas };
  const addrStr = formatDireccion(direccionActual);

  const pagar = async () => {
    if (!nombre.trim()) return toast('Completá tu nombre completo.', 'error');
    if (!dni.trim()) return toast('Completá tu DNI.', 'error');
    if (!telefono.trim()) return toast('Completá un teléfono de contacto.', 'error');
    if (!calle.trim() || !numero.trim() || !ciudad.trim() || !provincia.trim() || !cp.trim()) {
      return toast('Completá la dirección de envío completa.', 'error');
    }
    if (producto.stock <= 0) return toast('Sin stock disponible.', 'error');
    setBusy(true);
    try {
      const numeroOrd = await nextNumero();
      const direccionSnap = { calle:calle.trim(), numero:numero.trim(), pisoDepto:pisoDepto.trim(),
                              ciudad:ciudad.trim(), provincia:provincia.trim(), cp:cp.trim(),
                              notas:notas.trim(), telefono:telefono.trim() };
      const ref = await db.collection('pedidos').add({
        numero: numeroOrd,
        productoId: producto.id || null,
        productoNombre: producto.nombre,
        talle: norm(producto.talle),
        categoria: norm(producto.categoria),
        precio: Number(producto.precio),
        nombre: nombre.trim(), dni: dni.trim(),
        direccion: direccionSnap,
        userId: user.uid, userEmail: user.email,
        estado: 'pendiente',
        fecha: firebase.firestore.FieldValue.serverTimestamp()
      });
      const pref = await crearPreferencia(buildPreferencia({
        titulo: producto.nombre + (producto.talle ? ' (Talle ' + norm(producto.talle) + ')' : ''),
        precio: producto.precio, ref: ref.id,
        nombre: nombre.trim(), dni: dni.trim(), email: user.email, config
      }));
      const url = pref.init_point || pref.sandbox_init_point;
      if (!url) throw new Error('Mercado Pago no devolvió un link de pago.');
      toast('Tu número de orden es ' + fmtNumero(numeroOrd) + '. Redirigiendo al portal de pago…', 'info');
      window.location.href = url;
    } catch (e) {
      toast('Error al iniciar el pago: ' + e.message, 'error');
      setBusy(false);
    }
  };

  if (!user) {
    return (
      <div className="overlay" onClick={onClose}>
        <div className="sheet" onClick={e => e.stopPropagation()}>
          <div className="sheet-handle"/>
          <h3 className="sheet-title">🔐 Un paso antes de comprar</h3>
          <div className="buy-resumen">
            <b>{producto.nombre}{producto.talle ? ' · Talle ' + norm(producto.talle) : ''}</b>
            <span className="price">{money(producto.precio, config)}</span>
          </div>
          <p className="hint" style={{marginTop:'10px'}}>
            Ingresá con Google o con tu correo electrónico.
            Ahí quedarán guardados tu pedido, tu número de orden y tu dirección de envío.
          </p>
          <AuthForm toast={toast} cta="Crear cuenta y continuar"/>
          <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        </div>
      </div>
    );
  }

  return (
    <div className="overlay" onClick={busy ? null : onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-handle"/>
        <h3 className="sheet-title">🛒 Confirmar Pedido</h3>
        <div className="buy-resumen">
          <b>{producto.nombre}{producto.talle ? ' · Talle ' + norm(producto.talle) : ''}</b>
          <span className="price">{money(producto.precio, config)}</span>
        </div>

        <h4 style={{fontSize:13, fontWeight:800, marginTop:16, marginBottom:6, color:'var(--accent)', letterSpacing:1}}>👤 Datos del comprador</h4>
        <label>Nombre completo *</label>
        <input className="input" value={nombre} onChange={e => setNombre(e.target.value)} placeholder="Como figura en tu documento"/>
        <div style={{display:'flex', gap:10}}>
          <div style={{flex:1}}>
            <label>DNI *</label>
            <input className="input" inputMode="numeric" value={dni} onChange={e => setDni(e.target.value)} placeholder="Solo números"/>
          </div>
          <div style={{flex:1}}>
            <label>Teléfono *</label>
            <input className="input" inputMode="tel" value={telefono} onChange={e => setTel(e.target.value)} placeholder="1123456789"/>
          </div>
        </div>

        <h4 style={{fontSize:13, fontWeight:800, marginTop:16, marginBottom:6, color:'var(--accent)', letterSpacing:1}}>📍 Dirección de envío</h4>
        <div style={{display:'flex', gap:10}}>
          <div style={{flex:2}}>
            <label>Calle *</label>
            <input className="input" value={calle} onChange={e => setCalle(e.target.value)} placeholder="Nombre de la calle"/>
          </div>
          <div style={{flex:1}}>
            <label>Número *</label>
            <input className="input" value={numero} onChange={e => setNum(e.target.value)} placeholder="1234"/>
          </div>
        </div>
        <label>Piso / Depto (opcional)</label>
        <input className="input" value={pisoDepto} onChange={e => setPiso(e.target.value)} placeholder="Ej: 3° B"/>
        <div style={{display:'flex', gap:10}}>
          <div style={{flex:2}}>
            <label>Ciudad *</label>
            <input className="input" value={ciudad} onChange={e => setCiudad(e.target.value)} placeholder="Ej: La Plata"/>
          </div>
          <div style={{flex:1}}>
            <label>CP *</label>
            <input className="input" inputMode="numeric" value={cp} onChange={e => setCp(e.target.value)} placeholder="1900"/>
          </div>
        </div>
        <label>Provincia *</label>
        <input className="input" value={provincia} onChange={e => setProv(e.target.value)} placeholder="Ej: Buenos Aires"/>
        <label>Notas de entrega (opcional)</label>
        <textarea className="input" rows="2" value={notas} onChange={e => setNotas(e.target.value)} placeholder="Ej: Timbre 2, dejar en portería"/>

        {addrStr && (
          <div className="buy-addr-preview">
            <b>Se enviará a:</b><br/>{addrStr}
          </div>
        )}
        <div className="buy-addr-edit" onClick={() => { onClose(); if (onOpenProfile) onOpenProfile(); }}>
          ✎ Actualizar mi dirección de perfil
        </div>

        <button className="btn btn-primary" style={{marginTop:'14px'}} onClick={pagar} disabled={busy}>
          {busy ? 'Conectando con Mercado Pago…' : '💳 Pagar con Mercado Pago'}
        </button>
        <button className="btn btn-ghost" onClick={onClose} disabled={busy}>Cancelar</button>
      </div>
    </div>
  );
}

const Row = ({ k, v }) => (<div className="trow"><span>{k}</span><b>{v}</b></div>);
const RowAddr = ({ v }) => (<div className="trow trow-addr"><span>📍 Dirección de envío</span><b>{v}</b></div>);

  const wa = waLink(config,
    'Hola ' + (config.title || 'AgorShopping') + '! Te consulto por mi pedido ' + numTxt +
    ' (' + pedido.productoNombre + (pedido.talle ? ' · Talle ' + pedido.talle : '') + '). Mi DNI: ' + (pedido.dni || '') + '.');
  const addrStr = pedido.direccion ? formatDireccion(pedido.direccion) : '';
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e => e.stopPropagation()}>
        <div className="sheet-handle"/>
        <div className="ticket-head">
          <div className="ticket-store">AgorShopping</div>
          <Badge estado={pedido.estado}/>
        </div>
        <h3 className="ticket-prod">{pedido.productoNombre}</h3>
        <div className="ticket-num">
          <div className="ticket-num-lbl">Número de orden</div>
          <div className="ticket-num-val">{numTxt}</div>
          <div className="ticket-num-hint">Mencioná este número en cualquier consulta o para enviar tu comprobante de pago.</div>
        </div>
        <div className="ticket-data">
          <Row k="Comprador" v={pedido.nombre}/>
          <Row k="DNI" v={pedido.dni}/>
          {pedido.direccion && pedido.direccion.telefono && <Row k="Teléfono" v={pedido.direccion.telefono}/>}
          {pedido.talle && <Row k="Talle" v={pedido.talle}/>}
          {pedido.categoria && <Row k="Categoría" v={pedido.categoria}/>}
          {addrStr && <RowAddr v={addrStr}/>}
          <Row k="Total" v={money(pedido.precio, config)}/>
          <Row k="Fecha" v={fmtFecha(pedido.fecha)}/>
          {pedido.entregadoEl && <Row k="Entregado" v={fmtFecha(pedido.entregadoEl)}/>}

        {wa && (
          <a className="btn btn-primary" target="_blank" rel="noopener" href={wa}>💬 Consultar por WhatsApp</a>

        <button className="btn btn-ghost" onClick={onClose}>Cerrar</button>
        <div className="ticket-id" style={{marginTop:'12px', marginBottom:0}}>ID interno: {pedido.id}</div>
      </div>
    </div>
  );
}

function ConfigWhatsapp({ config, toast }) {
  const [val, setVal] = useState(config.whatsapp || '');
  const [saving, setSaving] = useState(false);
  useEffect(() => { setVal(config.whatsapp || ''); }, [config.whatsapp]);
  const guardar = async () => {
    setSaving(true);
    try {
      await db.collection('config').doc('store').set({ whatsapp: val.replace(/\D/g, '') }, { merge: true });
      toast('✅ WhatsApp de contacto guardado.', 'success');
    } catch (e) { toast('Error: ' + e.message, 'error'); }
    setSaving(false);
  };
  return (
    <div className="card pad">
      <h4 className="card-title">💬 WhatsApp de contacto</h4>
      <p className="hint">Número con código de país, solo dígitos. Si está cargado, los clientes verán el botón "Consultar por WhatsApp" con su número de orden ya incluido en el mensaje.</p>
      <input className="input" inputMode="numeric" placeholder="5491122334455" value={val} onChange={e => setVal(e.target.value)}/>
      <button className="btn btn-primary" style={{marginTop:'12px'}} onClick={guardar} disabled={saving}>
        {saving ? 'Guardando…' : 'Guardar'}
      </button>
    </div>
  );
}

function ConfigFondo({ config, toast }) {
  const actual = FONDOS_OK.indexOf(config.fondo) >= 0 ? config.fondo : 'vortice';
  const [val, setVal] = useState(actual);
  const [color, setColor] = useState(config.vorticeColor || COLOR_VORTICE_DEFAULT);
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState(config.fondoImagen || '');
  const [saving, setSaving] = useState(false);
  useEffect(() => { setVal(actual); }, [actual]);
  useEffect(() => { setColor(config.vorticeColor || COLOR_VORTICE_DEFAULT); }, [config.vorticeColor]);
  useEffect(() => { if (!file) setPreview(config.fondoImagen || ''); }, [config.fondoImagen]);
  const onColor = window.AgorBrand ? window.AgorBrand.on(color) : '#fff';

  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    if (!f.type || !f.type.startsWith('image/')) return toast('Seleccioná un archivo de imagen válido.', 'error');
    if (preview && preview.startsWith('blob:')) URL.revokeObjectURL(preview);
    setFile(f); setPreview(URL.createObjectURL(f));
  };
  const guardar = async () => {
    if (val === 'imagen' && !file && !config.fondoImagen) return toast('Elegí una imagen para el fondo.', 'error');
    setSaving(true);
    try {
      const data = { fondo: val, vorticeColor: color };
      if (val === 'imagen' && file) data.fondoImagen = await uploadToImgBB(file);
      await db.collection('config').doc('store').set(data, { merge: true });
      setFile(null);
      toast('✅ Apariencia actualizada para todos los usuarios.', 'success');
    } catch (e) { toast('Error: ' + e.message, 'error'); }
    setSaving(false);
  };
  const options = [
    { id: 'vortice', label: 'Vórtice', hint: 'Partículas en movimiento con tu color de marca; se adapta al tema claro u oscuro.' },
    { id: 'liso',    label: 'Liso', hint: 'Color liso que acompaña el tema de cada usuario (claro u oscuro).' },
    { id: 'imagen',  label: 'Imagen', hint: 'Subí una imagen; se guarda automáticamente en imgBB.' }
  ];
  return (
    <div className="card pad">
      <h4 className="card-title">Color de marca</h4>
      <p className="hint">Se aplica al vórtice, al logo, al favicon y a los acentos de toda la tienda, combinado con el tema claro u oscuro de cada usuario.</p>
      <div className="bg-color-row">
        <input type="color" value={color} onChange={e => setColor(e.target.value)} aria-label="Color de marca"/>
        <code>{color.toUpperCase()}</code>
        <button type="button" className="btn-mini" style={{marginTop:0}} onClick={() => setColor(COLOR_VORTICE_DEFAULT)}>Restablecer azul</button>
      </div>
      <div className="brand-prev">
        <span className="sw" style={{background:color, color:onColor}}><BagIcon size={20}/></span>
        <span className="pill" style={{background:color, color:onColor}}>Comprar ahora</span>
        <span style={{color:color, fontWeight:700, fontSize:13}}>● Acento</span>
      </div>

      <h4 className="card-title" style={{marginTop:22}}>Fondo del sitio</h4>
      <p className="hint">Se muestra detrás de toda la tienda. El cambio se aplica a todos los usuarios.</p>
      <div className="bg-opts">
        {options.map(o => (
          <button key={o.id} type="button" className={'bg-opt ' + (val === o.id ? 'on' : '')} onClick={() => setVal(o.id)}>
            <b>{o.label}</b><small>{o.hint}</small>
          </button>
        ))}
      </div>

      {val === 'vortice' && (
        <div className="bg-sub">
          <div className="bg-preview" style={{backgroundImage:'radial-gradient(circle at center,' + color + ' 0%,transparent 68%)'}}/>
        </div>
      )}

      {val === 'imagen' && (
        <div className="bg-sub">
          <label className="img-file-btn" style={{display:'block', opacity: saving ? .5 : 1, pointerEvents: saving ? 'none' : 'auto'}}>
            📷 {preview ? 'Cambiar imagen' : 'Elegir imagen'}
            <input type="file" accept="image/*" onChange={onFile}/>
          </label>
          {preview && <div className="bg-preview" style={{backgroundImage:'url(' + JSON.stringify(preview) + ')'}}/>}
        </div>
      )}

      <button className="btn btn-primary" style={{marginTop:14}} onClick={guardar} disabled={saving}>
        {saving ? (val === 'imagen' && file ? 'Subiendo imagen…' : 'Guardando…') : 'Guardar apariencia'}
      </button>
    </div>
  );
}

function ImageUploader({ items, onChange, toast, busy }) {
  const fileRef = useRef(null);
  const handleFiles = (files) => {
    const nuevos = Array.from(files || []).filter(f => f.type && f.type.startsWith('image/')).map(f => ({
      id: 'f_' + Math.random().toString(36).slice(2),
      src: URL.createObjectURL(f), file: f, kind: 'file', name: f.name, uploading: false
    }));
    if (nuevos.length === 0) return toast('Seleccioná archivos de imagen válidos.', 'error');
    onChange([...items, ...nuevos]);
    if (fileRef.current) fileRef.current.value = '';
  };
  const addUrl = () => {
    const raw = prompt('Pegá la URL de la imagen (https://…):');
    if (!raw) return;
    const url = raw.trim();
    if (!/^https?:\/\/.+/i.test(url)) return toast('URL no válida.', 'error');
    onChange([...items, {
      id: 'u_' + Math.random().toString(36).slice(2),
      src: url, kind: 'url', name: url.split('/').pop() || 'imagen', uploading: false
    }]);
  };
  const remove = (id) => onChange(items.filter(x => x.id !== id));
  return (
    <div className="img-uploader">
      {items.length > 0 && (
        <div className="img-thumbs">
          {items.map((it, i) => (
            <div key={it.id} className={'img-thumb ' + (it.uploading ? 'uploading' : '')}>
              {it.kind === 'file'
                ? <img src={it.src} alt={it.name || ''}/>
                : <img src={it.src} alt="" onError={e => { e.target.style.display='none'; }}/>}
              {!it.uploading && (
                <button type="button" className="img-thumb-x" onClick={() => remove(it.id)}>✕</button>
              )}
              {i === 0 && !it.uploading && <span className="img-thumb-first">PORTADA</span>}
            </div>
          ))}
        </div>
      )}
      <div className="img-add-row">
        <label className="img-file-btn" style={{opacity: busy ? .5 : 1, pointerEvents: busy ? 'none' : 'auto'}}>
          📷 Añadir imágenes
          <input ref={fileRef} type="file" accept="image/*" multiple
                 onChange={e => handleFiles(e.target.files)}/>
        </label>
        <button type="button" className="img-file-btn" style={{flex:'0 0 auto', padding:'10px 16px'}} onClick={addUrl} disabled={busy}>
          🔗 URL
        </button>
      </div>
      <p className="hint" style={{marginTop:6, fontSize:11}}>
        La primera imagen es la <b>portada</b> del catálogo. Todas las demás se ven al abrir el producto (con zoom).
      </p>
    </div>
  );
}

function GestionProductos({ productos, pedidos, toast, config }) {
  const vacio = { nombre:'', precio:'', stock:'', categoria:'', talle:'', descripcion:'', imagenes: [] };
  const [f, setF] = useState(vacio);
  const [editId, setEditId] = useState(null);
  const [saving, setSaving] = useState(false);
  const set = (k, v) => setF(p => Object.assign({}, p, { [k]: v }));
  const editar = (p) => {
    const imagenes = productoImagenes(p).map((src, i) => ({
      id: 'e_' + i + '_' + Math.random().toString(36).slice(2, 7),
      src, kind: 'url', name: 'img' + (i+1), uploading: false
    }));
    setF({
      nombre: p.nombre || '',
      precio: p.precio != null ? String(p.precio) : '',
      stock: p.stock != null ? String(p.stock) : '',
      categoria: p.categoria || '',
      talle: p.talle || '',
      descripcion: p.descripcion || '',
      imagenes
    });
    setEditId(p.id);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  const cancelarEdicion = () => { setF(vacio); setEditId(null); };
  const procesarImagenes = async (items) => {
    const resultado = [];
    for (const it of items) {
      if (it.kind === 'url') { resultado.push(it.src); continue; }
      setF(cur => Object.assign({}, cur, {
        imagenes: cur.imagenes.map(x => x.id === it.id ? Object.assign({}, x, { uploading: true }) : x)
      }));
      try {
        const url = await uploadToImgBB(it.file);
        resultado.push(url);
        if (it.src && it.src.startsWith('blob:')) URL.revokeObjectURL(it.src);
      } catch (e) {
        throw new Error('No se pudo subir "' + (it.name || 'imagen') + '": ' + e.message);
      }
    }
    return resultado;
  };
  const guardar = async () => {
    if (!f.nombre.trim() || !f.precio) return toast('Nombre y precio son obligatorios.', 'error');
    setSaving(true);
    try {
      const imagenesUrl = await procesarImagenes(f.imagenes || []);
      const payload = {
        nombre: f.nombre.trim(), descripcion: f.descripcion.trim(),
        categoria: f.categoria.trim(), talle: f.talle.trim(),
        imagenes: imagenesUrl, imagenUrl: imagenesUrl[0] || '',
        precio: parseFloat(f.precio) || 0, stock: parseInt(f.stock) || 0,
      };
      if (editId) {
        await db.collection('productos').doc(editId).update(Object.assign({ actualizadoEl: Date.now() }, payload));
        toast('✅ Producto actualizado.', 'success'); setEditId(null);
      } else {
        await db.collection('productos').add(Object.assign({ creadoEl: Date.now() }, payload));
        toast('✅ Producto agregado correctamente.', 'success');
      }
      setF(vacio);
    } catch (e) { toast('Error: ' + e.message, 'error'); }
    finally { setSaving(false); }
  };
  const borrar = async (p) => {
    if (!confirm('¿Eliminar permanentemente "' + p.nombre + '"?')) return;
    try { await db.collection('productos').doc(p.id).delete(); toast('🗑️ Producto eliminado.', 'success'); }
    catch (e) { toast('Error: ' + e.message, 'error'); }
  };
  const aprobar = async (p) => {
    if (!confirm('¿Aprobar el pago del pedido ' + numeroDe(p) + ' de ' + p.nombre + '?')) return;
    try {
      await db.collection('pedidos').doc(p.id).update({
        estado: 'aprobado', aprobadoManual: true,
        pagadoEl: firebase.firestore.FieldValue.serverTimestamp()
      });
      await descontarStock(p.productoId);
      toast('✅ Pago del pedido ' + numeroDe(p) + ' aprobado.', 'success');
    } catch (e) { toast('Error: ' + e.message, 'error'); }
  };
  const rechazar = async (p) => {
    if (!confirm('¿Rechazar el pedido ' + numeroDe(p) + ' de ' + p.nombre + '?')) return;
    try {
      await db.collection('pedidos').doc(p.id).update({ estado: 'rechazado' });
      toast('❌ Pedido ' + numeroDe(p) + ' rechazado.', 'info');
    } catch (e) { toast('Error: ' + e.message, 'error'); }
  };
  const entregar = async (p) => {
    try {
      await db.collection('pedidos').doc(p.id).update({
        estado: 'entregado',
        entregadoEl: firebase.firestore.FieldValue.serverTimestamp()
      });
      toast('📦 Pedido ' + numeroDe(p) + ' marcado como entregado.', 'success');
    } catch (e) { toast('Error: ' + e.message, 'error'); }
  };
  return (
    <div>
      <div className="card pad">
        <h4 className="card-title">{editId ? '✎ Editar producto' : '➕ Agregar nuevo producto'}</h4>
        <p className="hint">Las imágenes se suben automáticamente a imgBB al guardar. La primera será la portada del catálogo.</p>
        <label>Nombre del producto *</label>
        <input className="input" value={f.nombre} onChange={e => set('nombre', e.target.value)}/>
        <div className="color-row">
          <div style={{flex:1}}><label>Precio *</label><input className="input" type="number" min="0" value={f.precio} onChange={e => set('precio', e.target.value)}/></div>
          <div style={{flex:1}}><label>Stock disponible</label><input className="input" type="number" min="0" value={f.stock} onChange={e => set('stock', e.target.value)}/></div>
        </div>
        <div className="color-row">
          <div style={{flex:1}}><label>Categoría</label><input className="input" placeholder="Ej: Remeras" value={f.categoria} onChange={e => set('categoria', e.target.value)}/></div>
          <div style={{flex:1}}><label>Talle</label><input className="input" placeholder="Ej: S, M, L, XL, Único" value={f.talle} onChange={e => set('talle', e.target.value)}/></div>
        </div>
        <label>Imágenes (múltiples)</label>
        <ImageUploader items={f.imagenes} onChange={v => set('imagenes', v)} toast={toast} busy={saving}/>
        <label>Descripción</label>
        <textarea className="input" rows="4" value={f.descripcion} onChange={e => set('descripcion', e.target.value)}/>
        <div style={{display:'flex', gap:8, marginTop:14}}>
          <button className="btn btn-primary" style={{marginTop:0}} onClick={guardar} disabled={saving}>
            {saving ? 'Procesando imágenes…' : (editId ? '💾 Guardar cambios' : 'Agregar producto')}
          </button>
          {editId && (
            <button className="btn btn-ghost" style={{marginTop:0, flex:'0 0 auto', padding:'14px 20px'}} onClick={cancelarEdicion} disabled={saving}>
              Cancelar
            </button>
          )}
        </div>
      </div>

      <h4 className="list-title">Productos publicados ({productos.length})</h4>
      {productos.length === 0 && <div className="empty">Todavía no agregaste productos.</div>}
      {productos.map(p => {
        const primera = productoImagenes(p)[0];
        const total = productoImagenes(p).length;
        return (
          <div className="admin-row" key={p.id}>
            {primera ? <img className="admin-thumb" src={primera} alt=""/> : <div className="admin-thumb"><LogoMark size={36}/></div>}
            <div className="admin-info">
              <div className="admin-nom">{p.nombre}</div>
              <div className="admin-meta">
                {money(p.precio, config)} · Stock: {p.stock}
                {total > 0 && <span> · 🖼 {total}</span>}
                {(p.categoria || p.talle) && <span> · {[norm(p.categoria), norm(p.talle) ? 'Talle ' + norm(p.talle) : ''].filter(Boolean).join(' / ')}</span>}
              </div>
            </div>
            <button className="btn-edit" onClick={() => editar(p)} title="Editar">✎</button>
            <button className="btn-del" onClick={() => borrar(p)}>✕</button>
          </div>
        );
      })}

      <h4 className="list-title">Pedidos recibidos ({pedidos.length})</h4>
      <p className="hint">Aprobá manualmente los pagos pendientes. Al aprobar se descuenta el stock.</p>
      {pedidos.length === 0 && <div className="empty">Aún no hay pedidos.</div>}
      {pedidos.slice(0, 60).map(p => {
        const addrStr = p.direccion ? formatDireccion(p.direccion) : '';
        return (
          <div className="admin-row" key={p.id}>
            <div className="admin-thumb">📋</div>
            <div className="admin-info">
              <div className="admin-nom">{numeroDe(p)} · {p.productoNombre}{p.talle ? ' · Talle ' + p.talle : ''}</div>
              <div className="admin-meta">{p.nombre} · {money(p.precio, config)} · {fmtFecha(p.fecha)}</div>
              {p.direccion && p.direccion.telefono && <div className="admin-meta">📞 {p.direccion.telefono}</div>}
              {addrStr && <div className="admin-addr">📍 {addrStr}</div>}
              <div style={{marginTop:'6px'}}><Badge estado={p.estado}/></div>
            </div>
            <div className="admin-actions">
              {p.estado === 'pendiente' && (
                <>
                  <button className="btn-mini" onClick={() => aprobar(p)}>✔ Aprobar</button>
                  <button className="btn-mini" style={{background:'var(--errbg)', color:'var(--err)', borderColor:'rgba(239,68,68,.3)'}} onClick={() => rechazar(p)}>✖ Rechazar</button>
                </>
              )}
              {p.estado === 'aprobado' && (
                <button className="btn-mini" style={{background:'var(--usedbg)', color:'var(--used)', borderColor:'rgba(148,163,184,.3)'}} onClick={() => entregar(p)}>📦 Entregado</button>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );
}

function AdminView({ config, productos, pedidos, toast }) {
  return (
    <div>
      <h3 className="section-title">Panel de administración</h3>
      <GestionProductos productos={productos} pedidos={pedidos} toast={toast} config={config}/>
      <ConfigFondo config={config} toast={toast}/>
      <ConfigWhatsapp config={config} toast={toast}/>
    </div>
  );
}

function App() {
  const [booting, setBooting] = useState(true);
  const [bootError, setBootError] = useState(false);
  const [user, setUser] = useState(null);
  const [profile, setProfile] = useState(null); // perfil cargado desde /users/{uid}
  const [profileLoading, setProfileLoading] = useState(false);
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [tab, setTab] = useState('tienda');
  const [productos, setProductos] = useState([]);
  const [pedidos, setPedidos] = useState([]);
  const [todosPedidos, setTodosPedidos] = useState([]);
  const [comprando, setComprando] = useState(null);
  const [authOpen, setAuthOpen] = useState(false);
  const [profileOpen, setProfileOpen] = useState(false);
  const [toasts, setToasts] = useState([]);

  const isAdmin = !!(user && ADMIN_EMAIL && user.email && user.email.toLowerCase() === String(ADMIN_EMAIL).toLowerCase());
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light');
  const toggleTheme = () => setTheme(t => (t === 'dark' ? 'light' : 'dark'));
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', theme);
    try { localStorage.setItem('agor-theme', theme); } catch (e) {}
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#0b0b0e' : '#f5f4f1');
  }, [theme]);
  useEffect(() => {
    /* Hasta que llegue Firebase se usa el color cacheado; después, el configurado por el admin */
    if (window.AgorBrand) window.AgorBrand.apply(config._loaded ? config.vorticeColor : null, theme);
  }, [theme, config.vorticeColor, config._loaded]);

  const toast = (msg, type) => {
    const id = Date.now() + Math.random();
    setToasts(t => [...t, { id, msg, type: type || 'info' }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3800);
  };

  /* Auth listener */
  useEffect(() => {
    if (!auth) { setBooting(false); return; }
    let done = false;
    const unsub = auth.onAuthStateChanged(u => { done = true; setUser(u); setBooting(false); });
    const t = setTimeout(() => { if (!done) setBootError(true); }, 10000);
    return () => { clearTimeout(t); unsub(); };
  }, []);

  /* Cargar perfil cuando hay usuario */
  useEffect(() => {
    if (!user) { setProfile(null); return; }
    let cancel = false;
    (async () => {
      setProfileLoading(true);
      const p = await loadProfile(user.uid);
      if (!cancel) setProfile(p);
      setProfileLoading(false);
    })();
    return () => { cancel = true; };
  }, [user && user.uid]);

  useEffect(() => {
    if (!db) return;
    return db.collection('config').doc('store').onSnapshot(snap => {
      const cfg = Object.assign({}, DEFAULT_CONFIG, snap.exists ? snap.data() : {});
      if (/blood/i.test(cfg.title || '')) cfg.title = DEFAULT_CONFIG.title;
      cfg._loaded = true;
      setConfig(cfg);
    }, () => {});
  }, []);

  useEffect(() => {
    document.title = config.title || 'AgorShopping';
  }, [config]);

  useEffect(() => {
    if (!db) { setProductos([]); return; }
    return db.collection('productos').onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => (b.creadoEl || 0) - (a.creadoEl || 0));
      setProductos(arr);
    }, e => toast('Error al cargar productos: ' + e.message, 'error'));
  }, []);

  useEffect(() => {
    if (!db || !user) { setPedidos([]); return; }
    return db.collection('pedidos').where('userId', '==', user.uid).onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => (b.numero || 0) - (a.numero || 0) || tsNum(b.fecha) - tsNum(a.fecha));
      setPedidos(arr);
    }, () => {});
  }, [user]);

  useEffect(() => {
    if (!db || !isAdmin) { setTodosPedidos([]); return; }
    return db.collection('pedidos').onSnapshot(snap => {
      const arr = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
      arr.sort((a, b) => tsNum(b.fecha) - tsNum(a.fecha));
      setTodosPedidos(arr);
    }, () => {});
  }, [isAdmin]);

  useEffect(() => { if (!user) { setTab(t => (t === 'admin' ? 'tienda' : t)); } }, [user]);

  useEffect(() => {
    if (booting || !db) return;
    const params = new URLSearchParams(window.location.search);
    const ext = params.get('external_reference');
    const status = params.get('collection_status') || params.get('status');
    if (!ext || !status) return;
    window.history.replaceState({}, '', window.location.pathname);
    (async () => {
      try {
        const ref = db.collection('pedidos').doc(ext);
        const snap = await ref.get();
        if (!snap.exists) return;
        const p = snap.data();
        if (status === 'approved') {
          if (p.estado === 'pendiente' || p.estado === 'rechazado') {
            await ref.update({ estado: 'aprobado', pagadoEl: firebase.firestore.FieldValue.serverTimestamp() });
            await descontarStock(p.productoId);
          }
          toast('✅ ¡Pago confirmado! Tu pedido ' + numeroDe(p) + ' está en Mis Pedidos.', 'success');
          setTab('pedidos');
        } else if (status === 'pending' || status === 'in_process' || status === 'authorized') {
          toast('⏳ Pago pendiente. Tu número de orden es ' + numeroDe(p) + '.', 'info');
          setTab('pedidos');
        } else {
          if (p.estado === 'pendiente') await ref.update({ estado: 'rechazado' });
          toast('❌ El pago fue rechazado.', 'error');
        }
      } catch (e) { toast('No se pudo verificar el pago: ' + e.message, 'error'); }
    })();
  }, [booting]);

  const reintentarPago = async (pedido) => {
    try {
      toast('⏳ Generando nuevo link de pago…', 'info');
      const pref = await crearPreferencia(buildPreferencia({
        titulo: pedido.productoNombre + (pedido.talle ? ' (Talle ' + pedido.talle + ')' : ''),
        precio: pedido.precio, ref: pedido.id,
        nombre: pedido.nombre, dni: pedido.dni, email: user.email, config
      }));
      const url = pref.init_point || pref.sandbox_init_point;
      if (!url) throw new Error('Sin link de pago.');
      window.location.href = url;
    } catch (e) { toast('❌ ' + e.message, 'error'); }
  };

  if (!CREDS_OK || FB_ERROR || !auth) return (<><CredsScreen fbError={FB_ERROR}/><Toasts toasts={toasts}/></>);
  if (booting) return (<><Splash error={bootError}/><Toasts toasts={toasts}/></>);

  return (
    <>
      <FondoSitio config={config} theme={theme}/>
      <Header user={user} config={config} isAdmin={isAdmin}
              onAuth={() => setAuthOpen(true)}
              onProfile={() => setProfileOpen(true)}
              profile={profile} theme={theme} onToggleTheme={toggleTheme}/>
      <main className="app">
        {config.banner && <div className="banner">📣 {config.banner}</div>}
        {tab === 'tienda' && <TiendaView productos={productos} config={config} onComprar={setComprando} toast={toast}/>}
        {tab === 'pedidos' && <PedidosView pedidos={pedidos} config={config} onPagar={reintentarPago} user={user} onAuth={() => setAuthOpen(true)}/>}
        {tab === 'admin' && isAdmin && <AdminView config={config} productos={productos} pedidos={todosPedidos} toast={toast}/>}
      </main>
      <BottomNav tab={tab} setTab={setTab} isAdmin={isAdmin}/>
      {comprando && <CompraModal producto={comprando} config={config} user={user} profile={profile}
              onClose={() => setComprando(null)} toast={toast}
              onOpenProfile={() => setProfileOpen(true)}/>}
      {authOpen && <AuthModal onClose={() => setAuthOpen(false)} toast={toast}/>}
      {profileOpen && user && (
        <ProfileModal user={user} profile={profile}
                      onClose={() => setProfileOpen(false)}
                      toast={toast}
                      onSaved={(p) => setProfile(p)}/>
      )}
      <Toasts toasts={toasts}/>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
window.__APP_RENDERED__ = true;
</script>
</body>
</html>
